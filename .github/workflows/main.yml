name: Release

on:
  workflow_dispatch:

env:
  BINARY_NAME: omnidns
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: build-${{ matrix.target }}-

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: |
          cross build \
            --release \
            --target ${{ matrix.target }} \
            --bin omnidns

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/omnidns \
             ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}

      - name: Strip binary (amd64 only)
        if: matrix.arch == 'amd64'
        run: strip ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}

      - name: Show binary info
        run: |
          ls -lh ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}
          file ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}
          path: ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # Only create a release on tag pushes
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum omnidns-linux-amd64 omnidns-linux-arm64 > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: omnidns v0.1.0
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/omnidns-linux-amd64
            artifacts/omnidns-linux-arm64
            artifacts/sha256sums.txt
