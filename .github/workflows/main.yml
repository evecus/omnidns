name: test

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARY_NAME: omnidns
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: build-${{ matrix.target }}-

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: |
          cross build \
            --release \
            --target ${{ matrix.target }} \
            --bin omnidns

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/omnidns \
             ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}

      - name: Strip binary (amd64 only)
        if: matrix.arch == 'amd64'
        run: strip ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}

      - name: Show binary info
        run: |
          ls -lh ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}
          file ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: omnidns test
          draft: false
          files: |
            ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}
